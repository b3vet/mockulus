version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all

  exclusions:
    generated: lax
    rules:
      # x/net/http2/h2c is deprecated and its named replacement does not
      # replace it: net/http's Protocols/SetUnencryptedHTTP2 speaks cleartext
      # HTTP/2 by prior knowledge only, and has no equivalent of the HTTP/1.1
      # `Upgrade: h2c` handshake. The migration was tried and
      # TestH2CEnabledGatesCleartextHTTP2 rejected it — the upgrade case
      # answered 200 where it must answer 101. Scoped to the one file that
      # imports it, so the deprecation stays visible everywhere else and this
      # goes away the day net/http grows the handshake. See the comment on
      # Server.mockHandler.
      - path: internal/server/server\.go$
        linters:
          - staticcheck
        text: 'SA1019.*h2c'
      # The vendored Handlebars fork keeps upstream style; we only prune it.
      - path: internal/handlebars/
        linters:
          - errcheck
          - gocritic
          - revive
          - staticcheck
          - unparam
          - unused
      - path: _test\.go$
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/b3vet/mockulus
  exclusions:
    paths:
      - internal/handlebars
