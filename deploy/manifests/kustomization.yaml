# SPDX-License-Identifier: Apache-2.0
#
# A plain kustomize base for teams that would rather not run Helm. It is the
# zero-config shape: replicas serving from memory, no Couchbase.
#
#   kubectl apply -k deploy/manifests
#
# To add persistence, patch MOCKULUS_COUCHBASE_CONNSTR and the credential
# Secret in an overlay.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: mockulus-

commonLabels:
  app.kubernetes.io/name: mockulus
  app.kubernetes.io/managed-by: kustomize

resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml

images:
  - name: ghcr.io/b3vet/mockulus
    newTag: latest
