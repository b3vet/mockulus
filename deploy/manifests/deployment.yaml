apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mockulus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mockulus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: mockulus
          image: ghcr.io/b3vet/mockulus:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: mock
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: MOCKULUS_LOG_FORMAT
              value: json
          # Liveness never depends on the store: a Couchbase outage must not
          # restart pods, because the loaded snapshot is still servable.
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 512Mi}
          lifecycle:
            preStop:
              sleep:
                seconds: 3
