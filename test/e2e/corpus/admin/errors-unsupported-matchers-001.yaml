# SPDX-License-Identifier: Apache-2.0
id: errors-unsupported-matchers-001
behaviors:
  - B-ERR-1000
  - B-MATCH-EQUALTOXML-MATCHESXPATH
  - B-DEV-DEVIATION-14
# WireMock implements all of these, so there is no compatible answer to diff:
# the 422 is the deviation.
wm: n/a
steps:
  # Both XML matchers are deferred, and both are named in one answer.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "e770e770-0000-4000-8000-000000000032",
         "request": {"method": "POST", "urlPath": "/e2e/errors-unsupported-matchers-001/xml",
                     "bodyPatterns": [{"equalToXml": "<a>1</a>"},
                                      {"matchesXPath": "//a[text()='1']"}]},
         "response": {"status": 200}}
    expect:
      status: 422
      body_json_subset:
        errors:
          - code: 1000
            source: {pointer: "/request/bodyPatterns/0/equalToXml"}
          - code: 1000
            source: {pointer: "/request/bodyPatterns/1/matchesXPath"}
      body_regex: 'matchesXPath \(XPath matching\) is not supported in mockulus v1.*ROADMAP\.md'

  - admin: {method: GET, path: /__admin/mappings/e770e770-0000-4000-8000-000000000032}
    expect: {status: 404}

  # Neither document left anything behind on the mock port.
  - request:
      port: mock
      method: POST
      path: /e2e/errors-unsupported-matchers-001/xml
      headers: {Content-Type: application/xml}
      body: "<a>1</a>"
    expect: {status: 404}

  # The control: a bodyPattern built from supported matchers registers, matches
  # the body it describes and rejects the one it does not.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "e770e770-0000-4000-8000-000000000033",
         "request": {"method": "POST", "urlPath": "/e2e/errors-unsupported-matchers-001/xml",
                     "bodyPatterns": [{"contains": "<a>1</a>"}]},
         "response": {"status": 200, "body": "matched"}}
    expect: {status: 201}

  - request:
      port: mock
      method: POST
      path: /e2e/errors-unsupported-matchers-001/xml
      headers: {Content-Type: application/xml}
      body: "<a>1</a>"
    expect: {status: 200, body: "matched"}

  - request:
      port: mock
      method: POST
      path: /e2e/errors-unsupported-matchers-001/xml
      headers: {Content-Type: application/xml}
      body: "<a>2</a>"
    expect: {status: 404}
