# SPDX-License-Identifier: Apache-2.0
id: admin-crud-put-precedence-001
behaviors:
  - B-ADMIN-MAPPINGS-ID-PUT
wm: verified
# A non-matching step lands on a 404 whose body differs by design: WireMock
# renders a near-miss diff table there and mockulus deliberately does not
# (deviation #2). Only that body is given up; every other body, status and
# header is still diffed against the oracle.
wm_ignore: ["$unmatched-body"]
steps:
  # Two stubs on one path at equal (absent, therefore default) priority. The
  # tie-break is insertion sequence descending, so the later registration wins
  # (SPEC §5.3) — that is the baseline every assertion below is measured from.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "eeee0107-0000-4000-8000-000000000001",
         "request": {"method": "GET", "urlPath": "/e2e/admin-crud-put-precedence-001/lane"},
         "response": {"status": 200, "body": "A-v1"}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "eeee0107-0000-4000-8000-000000000002",
         "request": {"method": "GET", "urlPath": "/e2e/admin-crud-put-precedence-001/lane"},
         "response": {"status": 200, "body": "B-v1"}}
    expect: {status: 201}

  - request: {port: mock, method: GET, path: /e2e/admin-crud-put-precedence-001/lane}
    expect: {status: 200, body: "B-v1"}

  # THE load-bearing assertion of this case. Editing the losing stub must not
  # promote it. A PUT that drew a fresh insertion sequence would make A the
  # newest and silently flip which stub serves the path — a suite that edits a
  # stub between tests would see unrelated tests change answer, and the cause
  # would be invisible in both documents.
  - admin:
      method: PUT
      path: /__admin/mappings/eeee0107-0000-4000-8000-000000000001
      body: |
        {"request": {"method": "GET", "urlPath": "/e2e/admin-crud-put-precedence-001/lane"},
         "response": {"status": 200, "body": "A-v2"}}
    expect: {status: 200}

  - request: {port: mock, method: GET, path: /e2e/admin-crud-put-precedence-001/lane}
    expect: {status: 200, body: "B-v1"}

  # The edit did land — precedence was preserved, not the content. Without this
  # step the case would also pass against a PUT that did nothing at all.
  - admin: {method: GET, path: /__admin/mappings/eeee0107-0000-4000-8000-000000000001}
    expect:
      status: 200
      body_json_subset:
        response: {body: "A-v2"}

  # Symmetric check on the winner: editing B does not demote it either, and the
  # served body follows B's new content immediately.
  - admin:
      method: PUT
      path: /__admin/mappings/eeee0107-0000-4000-8000-000000000002
      body: |
        {"request": {"method": "GET", "urlPath": "/e2e/admin-crud-put-precedence-001/lane"},
         "response": {"status": 200, "body": "B-v2"}}
    expect: {status: 200}

  - request: {port: mock, method: GET, path: /e2e/admin-crud-put-precedence-001/lane}
    expect: {status: 200, body: "B-v2"}

  # With B removed, A serves — carrying the edit it received while it was the
  # loser, which is the other half of "the PUT changed content, not position".
  - admin: {method: DELETE, path: /__admin/mappings/eeee0107-0000-4000-8000-000000000002}
    expect: {status: 200}

  - request: {port: mock, method: GET, path: /e2e/admin-crud-put-precedence-001/lane}
    expect: {status: 200, body: "A-v2"}
