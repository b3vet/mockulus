id: wmv-sel-bucket-tiebreak-recency-001
behaviors: [B-STUB-PRIORITY, B-REQ-URL, B-REQ-URLPATH, B-REQ-URLPATTERN]
wm: verified
# Every step is served, so every body is diffed and each body names the URL
# criterion that won.
#
# One request, three stubs that reach it through three different URL criteria:
# an exact `url` including the query, a `urlPath` that ignores the query, and a
# `urlPattern` over the whole URL. §5.3 states one ordering over all matching
# stubs, and §6.3 implements it by merge-sorting several index lists — an exact
# hash bucket per URL, one per path, and the linearly scanned pattern list. The
# ordering claim is therefore also a claim about that merge: a lookup that
# consulted the exact-URL bucket first and only fell back to the others would
# satisfy every single-criterion case in the corpus and still answer this one
# wrongly, because it would never compare a hash hit against a newer pattern.
#
# All three carry the same priority, so only the insertion sequence can decide.
# Both registration orders are run, and each lane is unwound one stub at a time,
# so the assertion is the whole order rather than only its first element.
steps:
  # Lane A: exact URL first, path second, pattern last.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0004-4000-8000-000000000001",
         "priority": 4,
         "request": {"method": "GET",
                     "url": "/e2e/wmv-sel-bucket-tiebreak-recency-001/a/lane?v=1"},
         "response": {"status": 200, "body": "url",
                      "headers": {"Content-Type": "text/plain"}}}
    expect:
      status: 201
      body_json_subset:
        priority: 4
        request: {url: "/e2e/wmv-sel-bucket-tiebreak-recency-001/a/lane?v=1"}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0004-4000-8000-000000000002",
         "priority": 4,
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-sel-bucket-tiebreak-recency-001/a/lane"},
         "response": {"status": 200, "body": "path",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0004-4000-8000-000000000003",
         "priority": 4,
         "request": {"method": "GET",
                     "urlPattern": "/e2e/wmv-sel-bucket-tiebreak-recency-001/a/lane\\?v=[0-9]+"},
         "response": {"status": 200, "body": "pattern",
                      "headers": {"Content-Type": "text/plain"}}}
    expect:
      status: 201
      body_json_subset:
        request: {urlPattern: "/e2e/wmv-sel-bucket-tiebreak-recency-001/a/lane\\?v=[0-9]+"}

  # All three match this request. The newest answers, although it is the one
  # that costs the most to evaluate and the one an index-first lookup would
  # reach last.
  - request: {port: mock, method: GET, path: "/e2e/wmv-sel-bucket-tiebreak-recency-001/a/lane?v=1"}
    expect:
      status: 200
      headers: {Content-Type: text/plain}
      body: "pattern"

  # A query the pattern does not accept and the exact URL is not, which leaves
  # the path stub alone. Without this the three bodies above would only show
  # that something answered; here they are shown to be three different stubs
  # reachable on their own terms.
  - request: {port: mock, method: GET, path: "/e2e/wmv-sel-bucket-tiebreak-recency-001/a/lane?v=x"}
    expect: {status: 200, body: "path"}

  - admin: {method: DELETE, path: /__admin/mappings/a100000a-0004-4000-8000-000000000003}
    expect: {status: 200}

  - request: {port: mock, method: GET, path: "/e2e/wmv-sel-bucket-tiebreak-recency-001/a/lane?v=1"}
    expect: {status: 200, body: "path"}

  - admin: {method: DELETE, path: /__admin/mappings/a100000a-0004-4000-8000-000000000002}
    expect: {status: 200}

  - request: {port: mock, method: GET, path: "/e2e/wmv-sel-bucket-tiebreak-recency-001/a/lane?v=1"}
    expect: {status: 200, body: "url"}

  # Lane B: the same three shapes on a second path, registered in the opposite
  # order. If the exact-URL bucket were privileged, this lane would agree with
  # lane A's first answer instead of inverting it.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0004-4000-8000-000000000004",
         "priority": 4,
         "request": {"method": "GET",
                     "urlPattern": "/e2e/wmv-sel-bucket-tiebreak-recency-001/b/lane\\?v=[0-9]+"},
         "response": {"status": 200, "body": "pattern",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0004-4000-8000-000000000005",
         "priority": 4,
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-sel-bucket-tiebreak-recency-001/b/lane"},
         "response": {"status": 200, "body": "path",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0004-4000-8000-000000000006",
         "priority": 4,
         "request": {"method": "GET",
                     "url": "/e2e/wmv-sel-bucket-tiebreak-recency-001/b/lane?v=1"},
         "response": {"status": 200, "body": "url",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - request: {port: mock, method: GET, path: "/e2e/wmv-sel-bucket-tiebreak-recency-001/b/lane?v=1"}
    expect: {status: 200, body: "url"}

  - admin: {method: DELETE, path: /__admin/mappings/a100000a-0004-4000-8000-000000000006}
    expect: {status: 200}

  - request: {port: mock, method: GET, path: "/e2e/wmv-sel-bucket-tiebreak-recency-001/b/lane?v=1"}
    expect: {status: 200, body: "path"}

  - admin: {method: DELETE, path: /__admin/mappings/a100000a-0004-4000-8000-000000000005}
    expect: {status: 200}

  - request: {port: mock, method: GET, path: "/e2e/wmv-sel-bucket-tiebreak-recency-001/b/lane?v=1"}
    expect: {status: 200, body: "pattern"}
