# SPDX-License-Identifier: Apache-2.0
id: wmv-body-caseinsensitive-scope-001
behaviors:
  - B-MATCH-EQUALTO-CASEINSENSITIVE
  - B-MATCH-CONTAINS-DOESNOTCONTAIN
  - B-MATCH-MATCHES-DOESNOTMATCH
  - B-REQ-BODYPATTERNS
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2/#18). Status and headers are still diffed.
wm_ignore: ["$unmatched-body"]
steps:
  # caseInsensitive is a modifier of equalTo, not a property of the matcher
  # document, and the difference only shows when someone writes it next to a
  # matcher that does not read it. WireMock drops the flag there; the stub keeps
  # comparing bytes. An implementation that lifted the flag to the document
  # level — the tidy-looking refactor — would turn these two stubs
  # case-insensitive and match requests their authors excluded.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0003-4000-8000-000000000001",
         "name": "caseInsensitive next to contains",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-caseinsensitive-scope-001/contains",
                     "bodyPatterns": [{"contains": "abc", "caseInsensitive": true}]},
         "response": {"status": 200, "body": "contains",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0003-4000-8000-000000000002",
         "name": "caseInsensitive next to matches",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-caseinsensitive-scope-001/matches",
                     "bodyPatterns": [{"matches": "abc", "caseInsensitive": true}]},
         "response": {"status": 200, "body": "matches",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  # The flag written out as false has to mean what leaving it out means. A
  # reader who spells the default explicitly is documenting an intention, and a
  # binding that treated "the key is present" as "the flag is on" would invert
  # exactly that stub.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0003-4000-8000-000000000003",
         "name": "caseInsensitive spelled out as false",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-caseinsensitive-scope-001/explicit-false",
                     "bodyPatterns": [{"equalTo": "AbC", "caseInsensitive": false}]},
         "response": {"status": 200, "body": "explicit-false",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  # The control: the same operand where the flag does apply.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0003-4000-8000-000000000004",
         "name": "caseInsensitive where it belongs",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-caseinsensitive-scope-001/equal-ci",
                     "bodyPatterns": [{"equalTo": "AbC", "caseInsensitive": true}]},
         "response": {"status": 200, "body": "equal-ci",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-caseinsensitive-scope-001/contains, body: "xxabcxx"}
    expect: {status: 200, body: "contains"}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-caseinsensitive-scope-001/contains, body: "xxABCxx"}
    expect: {status: 404}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-caseinsensitive-scope-001/matches, body: "abc"}
    expect: {status: 200, body: "matches"}

  # A pattern that wanted to ignore case has `(?i)` for it, which is why the
  # flag being ignored here costs a stub author nothing.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-caseinsensitive-scope-001/matches, body: "ABC"}
    expect: {status: 404}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-caseinsensitive-scope-001/explicit-false, body: "AbC"}
    expect: {status: 200, body: "explicit-false"}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-caseinsensitive-scope-001/explicit-false, body: "abc"}
    expect: {status: 404}

  # Which is the step that keeps the four above honest: the very same operand
  # and the very same body do match once the flag is on, so the 404s are the
  # flag not applying rather than the flag never working.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-caseinsensitive-scope-001/equal-ci, body: "abc"}
    expect: {status: 200, body: "equal-ci"}
