# SPDX-License-Identifier: Apache-2.0
id: wmv-body-or-absent-optional-001
behaviors: [B-MATCH-AND-OR-NOT, B-MATCH-ABSENT, B-REQ-BODYPATTERNS]
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2/#18). Status and headers are still diffed.
wm_ignore: ["$unmatched-body"]
steps:
  # An optional body — "either nothing, or exactly this" — is the one shape that
  # needs `absent` and a content matcher in the same criterion, and it only
  # works if the combinator is evaluated over the subject rather than over the
  # subject's text. An `or` whose operands were only ever asked about a value
  # would have no value to ask about here and could not answer the first step
  # below at all.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0011-4000-8000-000000000001",
         "name": "the body is optional but fixed when present",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-or-absent-optional-001/optional",
                     "bodyPatterns": [{"or": [{"absent": true}, {"equalTo": "x"}]}]},
         "response": {"status": 200, "body": "optional",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  # The absent branch.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-or-absent-optional-001/optional}
    expect: {status: 200, body: "optional"}

  # The value branch.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-or-absent-optional-001/optional, body: "x"}
    expect: {status: 200, body: "optional"}

  # Neither branch: a body that exists and is not the one named. This is what
  # separates the criterion from "the body does not matter" — the `absent`
  # operand widens what is accepted by exactly one subject, not by all of them.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-or-absent-optional-001/optional, body: "y"}
    expect: {status: 404}

  # And a body of one space, which is the subject a reader is most likely to
  # expect the absent branch to cover. It does not: the branch is about the body
  # not being there, and this one is.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-or-absent-optional-001/optional, body: " "}
    expect: {status: 404}
