# SPDX-License-Identifier: Apache-2.0
id: wmv-body-or-negative-operand-001
behaviors: [B-MATCH-AND-OR-NOT, B-MATCH-CONTAINS-DOESNOTCONTAIN, B-REQ-BODYPATTERNS]
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2/#18). Status and headers are still diffed.
wm_ignore: ["$unmatched-body"]
steps:
  # A combinator whose operands are a positive matcher and a negative one. The
  # two kinds answer an absent subject differently — the positive fails, the
  # negative holds — so an `or` over both has to ask each operand rather than
  # deciding the subject's fate once and handing down the verdict. That is the
  # step at the end of this case, and it is the one an implementation that
  # short-circuited on absence gets wrong.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0015-4000-8000-000000000001",
         "name": "or over a positive and a negative operand",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-or-negative-operand-001/either",
                     "bodyPatterns": [{"or": [{"equalTo": "exact"},
                                              {"doesNotContain": "x"}]}]},
         "response": {"status": 200, "body": "either",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  # The positive branch. Note that this body contains an "x", so it fails the
  # negative branch — it is here because it matches on the first operand alone.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-or-negative-operand-001/either, body: "exact"}
    expect: {status: 200, body: "either"}

  # The negative branch, on a body the positive one refuses.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-or-negative-operand-001/either, body: "abc"}
    expect: {status: 200, body: "either"}

  # Neither branch: not the exact value, and it carries the excluded text.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-or-negative-operand-001/either, body: "xyz"}
    expect: {status: 404}

  # An absent body satisfies the negative operand — there is no value there to
  # contain the text — and so satisfies the disjunction, even though the
  # positive operand fails it. Both operands had to be consulted for this
  # answer to come out.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-or-negative-operand-001/either}
    expect: {status: 200, body: "either"}
