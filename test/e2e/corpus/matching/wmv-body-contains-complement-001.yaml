# SPDX-License-Identifier: Apache-2.0
id: wmv-body-contains-complement-001
behaviors: [B-MATCH-CONTAINS-DOESNOTCONTAIN, B-MATCH-ABSENT, B-REQ-BODYPATTERNS]
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2/#18). Status and headers are still diffed.
wm_ignore: ["$unmatched-body"]
#
# Two stubs carrying the same operand under the two spellings, and every body
# below is sent to both. Over a present body the answers must be opposite —
# that is what "complement" means and it is the only way to state it without
# taking either matcher's word for the other. Over an ABSENT body they are both
# satisfied, and that asymmetry is the reason this is worth a case: a reader who
# assumes doesNotContain is `not contains` gets the empty-body row wrong, and so
# does an implementation that computes it that way.
steps:
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0006-4000-8000-000000000001",
         "name": "contains beta",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-contains-complement-001/positive",
                     "bodyPatterns": [{"contains": "beta"}]},
         "response": {"status": 200, "body": "positive",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0006-4000-8000-000000000002",
         "name": "doesNotContain beta",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-contains-complement-001/negative",
                     "bodyPatterns": [{"doesNotContain": "beta"}]},
         "response": {"status": 200, "body": "negative",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  # The operand is there.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-complement-001/positive, body: "alpha beta gamma"}
    expect: {status: 200, body: "positive"}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-complement-001/negative, body: "alpha beta gamma"}
    expect: {status: 404}

  # The operand is not there.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-complement-001/positive, body: "alpha gamma"}
    expect: {status: 404}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-complement-001/negative, body: "alpha gamma"}
    expect: {status: 200, body: "negative"}

  # Case is part of "there": the negative form is exactly as case-sensitive as
  # the positive one, which is what stops a doesNotContain criterion from
  # quietly excluding more than its author wrote.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-complement-001/positive, body: "alpha BETA gamma"}
    expect: {status: 404}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-complement-001/negative, body: "alpha BETA gamma"}
    expect: {status: 200, body: "negative"}

  # And the row where the complement breaks. A zero-length body is absent, and
  # an absent body has no value to contain the operand — so the positive form
  # fails and the negative form holds. Both stubs answering the same way here is
  # correct, and it is the one pair of answers a `not contains` implementation
  # cannot produce.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-complement-001/positive}
    expect: {status: 404}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-complement-001/negative}
    expect: {status: 200, body: "negative"}
