# SPDX-License-Identifier: Apache-2.0
id: wmv-body-equalto-form-encoded-001
behaviors: [B-MATCH-EQUALTO-CASEINSENSITIVE, B-REQ-BODYPATTERNS]
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2/#18). Status and headers are still diffed.
wm_ignore: ["$unmatched-body"]
steps:
  # A form-encoded body is the one place where a body matcher could plausibly be
  # expected to understand the payload: the Content-Type says how to parse it,
  # the stub language has formParameters for exactly that, and a request with
  # the same fields in a different order is the same form. bodyPatterns is not
  # that. It sees the raw text, so parameter order matters and percent-encoding
  # is characters rather than the bytes they stand for. A stub author who wants
  # the parsed view has formParameters; what must not happen is bodyPatterns
  # quietly providing it.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0018-4000-8000-000000000001",
         "name": "equalTo over a form-encoded body",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-equalto-form-encoded-001/order",
                     "bodyPatterns": [{"equalTo": "a=1&b=2"}]},
         "response": {"status": 200, "body": "order",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0018-4000-8000-000000000002",
         "name": "equalTo over percent-encoded values",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-equalto-form-encoded-001/encoded",
                     "bodyPatterns": [{"equalTo": "a=1%2B2&b=x+y"}]},
         "response": {"status": 200, "body": "encoded",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - request:
      port: mock
      method: POST
      path: /e2e/wmv-body-equalto-form-encoded-001/order
      headers: {Content-Type: application/x-www-form-urlencoded}
      body: "a=1&b=2"
    expect: {status: 200, body: "order"}

  # The same two fields with the same two values, swapped. As a form these two
  # requests are identical; as bodies they are not.
  - request:
      port: mock
      method: POST
      path: /e2e/wmv-body-equalto-form-encoded-001/order
      headers: {Content-Type: application/x-www-form-urlencoded}
      body: "b=2&a=1"
    expect: {status: 404}

  # Declaring a different Content-Type changes nothing, which is the other half
  # of the claim: the matcher was never consulting it.
  - request:
      port: mock
      method: POST
      path: /e2e/wmv-body-equalto-form-encoded-001/order
      headers: {Content-Type: text/plain}
      body: "a=1&b=2"
    expect: {status: 200, body: "order"}

  - request:
      port: mock
      method: POST
      path: /e2e/wmv-body-equalto-form-encoded-001/encoded
      headers: {Content-Type: application/x-www-form-urlencoded}
      body: "a=1%2B2&b=x+y"
    expect: {status: 200, body: "encoded"}

  # The decoded spelling of the very same form: %2B is a plus sign and a plus
  # sign is a space. A matcher that decoded the body before comparing would
  # accept this and refuse the step above.
  - request:
      port: mock
      method: POST
      path: /e2e/wmv-body-equalto-form-encoded-001/encoded
      headers: {Content-Type: application/x-www-form-urlencoded}
      body: "a=1+2&b=x y"
    expect: {status: 404}
