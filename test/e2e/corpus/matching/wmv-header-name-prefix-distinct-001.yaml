# SPDX-License-Identifier: Apache-2.0
id: wmv-header-name-prefix-distinct-001
behaviors: [B-REQ-HEADERS, B-MATCH-ABSENT]
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2/#18). Status and headers are still diffed.
wm_ignore: ["$unmatched-body"]
steps:
  # A header criterion names one header, not a family of them. Prefix lookup is
  # a plausible accident in an index keyed by a sorted slice of names, and the
  # pair of stubs below turns it into two visible wrong answers rather than one.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000002-0003-4000-8000-000000000001",
         "name": "criterion on the shorter name",
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-header-name-prefix-distinct-001/exact",
                     "headers": {"X-Tag": {"equalTo": "v"}}},
         "response": {"status": 200, "body": "exact",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000002-0003-4000-8000-000000000002",
         "name": "the shorter name must be absent",
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-header-name-prefix-distinct-001/absent",
                     "headers": {"X-Tag": {"absent": true}}},
         "response": {"status": 200, "body": "absent",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - request:
      method: GET
      path: /e2e/wmv-header-name-prefix-distinct-001/exact
      headers: {X-Tag: v}
    expect: {status: 200, body: "exact"}

  # The value is exactly what the criterion asks for, so a 200 here could only
  # come from the longer name having answered for the shorter one.
  - request:
      method: GET
      path: /e2e/wmv-header-name-prefix-distinct-001/exact
      headers: {X-Tag-Extra: v}
    expect: {status: 404}

  # Headers the stub says nothing about are wildcards, so carrying both is fine
  # as long as the named one is right.
  - request:
      method: GET
      path: /e2e/wmv-header-name-prefix-distinct-001/exact
      headers: {X-Tag: v, X-Tag-Extra: other}
    expect: {status: 200, body: "exact"}

  # The mirror: the longer name being present says nothing about the shorter
  # one, which is still absent.
  - request:
      method: GET
      path: /e2e/wmv-header-name-prefix-distinct-001/absent
      headers: {X-Tag-Extra: v}
    expect: {status: 200, body: "absent"}

  - request:
      method: GET
      path: /e2e/wmv-header-name-prefix-distinct-001/absent
      headers: {X-Tag: v}
    expect: {status: 404}
