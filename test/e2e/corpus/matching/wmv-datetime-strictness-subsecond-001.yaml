# SPDX-License-Identifier: Apache-2.0
id: wmv-datetime-strictness-subsecond-001
behaviors: [B-MATCH-BEFORE-AFTER-EQUALTODATETIME-TRUNCATEEXPECTED-ACTUALFORMAT, B-REQ-HEADERS]
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2/#18). Status, headers and every matched body are still diffed.
wm_ignore: ["$unmatched-body"]
#
# The same strictness one granularity down, on an operand carrying fractional
# seconds. This is the case an implementation that resolves to whole seconds
# fails: under truncation the three actuals below all become 12:13:14, so both
# directions answer 404 for all three and `equalToDateTime` answers 200 for all
# three. Here each of the three gets a different answer.
steps:
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "da7e0002-0001-4000-8000-000000000001",
         "name": "before a fractional-second instant",
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-datetime-strictness-subsecond-001/before",
                     "headers": {"X-When": {"before": "2021-06-14T12:13:14.250Z"}}},
         "response": {"status": 200, "body": "before",
                      "headers": {"Content-Type": "text/plain"}}}
    expect:
      status: 201
      body_json_subset:
        request:
          headers:
            X-When: {before: "2021-06-14T12:13:14.250Z"}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "da7e0002-0001-4000-8000-000000000002",
         "name": "after the same fractional-second instant",
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-datetime-strictness-subsecond-001/after",
                     "headers": {"X-When": {"after": "2021-06-14T12:13:14.250Z"}}},
         "response": {"status": 200, "body": "after",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "da7e0002-0001-4000-8000-000000000003",
         "name": "equalToDateTime on the same fractional-second instant",
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-datetime-strictness-subsecond-001/equal",
                     "headers": {"X-When": {"equalToDateTime": "2021-06-14T12:13:14.250Z"}}},
         "response": {"status": 200, "body": "equal",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  # The boundary, with the equality falsifier beside it.
  - request:
      method: GET
      path: /e2e/wmv-datetime-strictness-subsecond-001/before
      headers: {X-When: "2021-06-14T12:13:14.250Z"}
    expect: {status: 404}
  - request:
      method: GET
      path: /e2e/wmv-datetime-strictness-subsecond-001/after
      headers: {X-When: "2021-06-14T12:13:14.250Z"}
    expect: {status: 404}
  - request:
      method: GET
      path: /e2e/wmv-datetime-strictness-subsecond-001/equal
      headers: {X-When: "2021-06-14T12:13:14.250Z"}
    expect: {status: 200, headers: {Content-Type: text/plain}, body: "equal"}

  # One millisecond either side.
  - request:
      method: GET
      path: /e2e/wmv-datetime-strictness-subsecond-001/before
      headers: {X-When: "2021-06-14T12:13:14.249Z"}
    expect: {status: 200, body: "before"}
  - request:
      method: GET
      path: /e2e/wmv-datetime-strictness-subsecond-001/after
      headers: {X-When: "2021-06-14T12:13:14.249Z"}
    expect: {status: 404}

  - request:
      method: GET
      path: /e2e/wmv-datetime-strictness-subsecond-001/after
      headers: {X-When: "2021-06-14T12:13:14.251Z"}
    expect: {status: 200, body: "after"}
  - request:
      method: GET
      path: /e2e/wmv-datetime-strictness-subsecond-001/before
      headers: {X-When: "2021-06-14T12:13:14.251Z"}
    expect: {status: 404}

  # And an actual with no fractional part at all is ordered against the fraction
  # rather than compared to it as text: 12:13:14 precedes 12:13:14.250.
  - request:
      method: GET
      path: /e2e/wmv-datetime-strictness-subsecond-001/before
      headers: {X-When: "2021-06-14T12:13:14Z"}
    expect: {status: 200, body: "before"}
  - request:
      method: GET
      path: /e2e/wmv-datetime-strictness-subsecond-001/after
      headers: {X-When: "2021-06-14T12:13:15Z"}
    expect: {status: 200, body: "after"}
