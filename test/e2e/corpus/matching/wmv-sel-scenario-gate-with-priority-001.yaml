# SPDX-License-Identifier: Apache-2.0
id: wmv-sel-scenario-gate-with-priority-001
behaviors: [B-STUB-SCENARIONAME-REQUIREDSCENARIOSTATE-NEWSCENARIOSTATE, B-STUB-PRIORITY]
wm: verified
# Every step is served, so every body is diffed.
#
# §5.3 puts the scenario gate and the precedence rule in a definite relationship:
# a stub whose requiredScenarioState does not hold is treated as non-matching,
# and iteration continues. That makes the gate part of matching rather than a
# tie-break, so it beats any priority number — a stub can hold the strongest
# number on the path and still not answer.
#
# The two stubs here are as far apart in precedence as a case can put them and
# the gated one is registered first, so it is the strongest and the oldest: the
# only thing that can keep it from answering is the state. The same request is
# sent before and after the flow moves, and the answer flips, which is what
# separates "the gate is evaluated" from "the gated stub happened to lose".
steps:
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0011-4000-8000-000000000001",
         "priority": 1,
         "scenarioName": "wmv-sel-scenario-gate-with-priority-001",
         "requiredScenarioState": "ready",
         "request": {"method": "GET", "urlPath": "/e2e/wmv-sel-scenario-gate-with-priority-001/order"},
         "response": {"status": 200, "body": "served from ready",
                      "headers": {"Content-Type": "text/plain"}}}
    expect:
      status: 201
      body_json_subset:
        priority: 1
        scenarioName: "wmv-sel-scenario-gate-with-priority-001"
        requiredScenarioState: "ready"

  # The fallback is in no scenario at all, so nothing gates it. It is both newer
  # and weaker, which is the combination that would lose every comparison in
  # §5.3 if the gated stub were eligible.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0011-4000-8000-000000000002",
         "priority": 9,
         "request": {"method": "GET", "urlPath": "/e2e/wmv-sel-scenario-gate-with-priority-001/order"},
         "response": {"status": 200, "body": "not ready yet",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  # The scenario has never been written to, so it is at Started and the gate does
  # not hold. A server that applied the gate only as a tie-break, or that read an
  # unwritten scenario as "any state", answers "served from ready" here.
  - request: {port: mock, method: GET, path: /e2e/wmv-sel-scenario-gate-with-priority-001/order}
    expect:
      status: 200
      headers: {Content-Type: text/plain}
      body: "not ready yet"

  # The stub that moves the flow. It names no requiredScenarioState, so it is
  # not gated itself and can be driven from wherever the scenario happens to be.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0011-4000-8000-000000000003",
         "scenarioName": "wmv-sel-scenario-gate-with-priority-001",
         "newScenarioState": "ready",
         "request": {"method": "POST", "urlPath": "/e2e/wmv-sel-scenario-gate-with-priority-001/arm"},
         "response": {"status": 200, "body": "armed",
                      "headers": {"Content-Type": "text/plain"}}}
    expect:
      status: 201
      body_json_subset:
        scenarioName: "wmv-sel-scenario-gate-with-priority-001"
        newScenarioState: "ready"

  - request: {port: mock, method: POST, path: /e2e/wmv-sel-scenario-gate-with-priority-001/arm}
    expect: {status: 200, body: "armed"}

  # The same request as before, against the same two stubs, and now the gated
  # one answers — so the gate is re-evaluated per request rather than resolved
  # when the stub was registered, and once it holds the priority number does
  # exactly what it always does.
  - request: {port: mock, method: GET, path: /e2e/wmv-sel-scenario-gate-with-priority-001/order}
    expect: {status: 200, body: "served from ready"}

  # The fallback is still there and still matching; it was outranked, not
  # replaced.
  - admin: {method: DELETE, path: /__admin/mappings/a100000a-0011-4000-8000-000000000001}
    expect: {status: 200}

  - request: {port: mock, method: GET, path: /e2e/wmv-sel-scenario-gate-with-priority-001/order}
    expect: {status: 200, body: "not ready yet"}
