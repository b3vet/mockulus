# SPDX-License-Identifier: Apache-2.0
id: wmv-sel-recency-over-specificity-001
behaviors: [B-STUB-PRIORITY, B-REQ-URLPATHPATTERN, B-REQ-HEADERS]
wm: verified
# Every step is served, so every body is diffed.
#
# The companion to wmv-sel-priority-over-specificity-001, one rung further down
# the ordering. There the two stubs were separated by their priority numbers;
# here both carry the same explicit priority, so §5.3's second key — insertion
# sequence, newest first — is the only thing left. The claim under test is that
# it really is the only thing left: how much a stub asks of the request still
# does not enter into it, so registering a catch-all after a carefully narrowed
# stub takes the endpoint away from it.
#
# Both registration orders are run against the same pair of shapes. A server
# that preferred the narrower candidate would answer "narrow" in both lanes; a
# server that preferred the broader one would answer "broad" in both. Only
# newest-wins produces one of each.
steps:
  # Lane A: narrow first, broad second.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0003-4000-8000-000000000001",
         "priority": 3,
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-sel-recency-over-specificity-001/a/item",
                     "headers": {"X-Key": {"equalTo": "k"}}},
         "response": {"status": 200, "body": "narrow",
                      "headers": {"Content-Type": "text/plain"}}}
    expect:
      status: 201
      body_json_subset: {priority: 3}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0003-4000-8000-000000000002",
         "priority": 3,
         "request": {"method": "GET",
                     "urlPathPattern": "/e2e/wmv-sel-recency-over-specificity-001/a/.*"},
         "response": {"status": 200, "body": "broad",
                      "headers": {"Content-Type": "text/plain"}}}
    expect:
      status: 201
      body_json_subset: {priority: 3}

  - request:
      port: mock
      method: GET
      path: /e2e/wmv-sel-recency-over-specificity-001/a/item
      headers: {X-Key: k}
    expect:
      status: 200
      headers: {Content-Type: text/plain}
      body: "broad"

  # Lane B: the identical pair, broad first this time.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0003-4000-8000-000000000003",
         "priority": 3,
         "request": {"method": "GET",
                     "urlPathPattern": "/e2e/wmv-sel-recency-over-specificity-001/b/.*"},
         "response": {"status": 200, "body": "broad",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0003-4000-8000-000000000004",
         "priority": 3,
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-sel-recency-over-specificity-001/b/item",
                     "headers": {"X-Key": {"equalTo": "k"}}},
         "response": {"status": 200, "body": "narrow",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - request:
      port: mock
      method: GET
      path: /e2e/wmv-sel-recency-over-specificity-001/b/item
      headers: {X-Key: k}
    expect: {status: 200, body: "narrow"}

  # The narrow stub won that round on sequence alone, so its criteria still have
  # to be load-bearing: without the header it does not match, and selection walks
  # past it to the broad stub rather than stopping at the first candidate in the
  # ordering.
  - request: {port: mock, method: GET, path: /e2e/wmv-sel-recency-over-specificity-001/b/item}
    expect: {status: 200, body: "broad"}

  # A sibling path under lane B's subtree is matched by the broad stub and by
  # nothing else, which is what makes "broad" an answer about that stub rather
  # than about the pair.
  - request: {port: mock, method: GET, path: /e2e/wmv-sel-recency-over-specificity-001/b/other}
    expect: {status: 200, body: "broad"}
