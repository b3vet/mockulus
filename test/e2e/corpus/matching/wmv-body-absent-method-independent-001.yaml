# SPDX-License-Identifier: Apache-2.0
id: wmv-body-absent-method-independent-001
behaviors: [B-MATCH-ABSENT, B-REQ-BODYPATTERNS]
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2/#18). Status and headers are still diffed.
wm_ignore: ["$unmatched-body"]
steps:
  # Whether a body is absent is a fact about the body, not about the verb that
  # carried it. The temptation is to shortcut it — GET and DELETE conventionally
  # have no body, so "GET means absent" looks free — and the shortcut is wrong
  # in both directions: it would call a GET with a body absent, and it would
  # have to decide what a POST with no body is. The stub takes method ANY so the
  # verb is not a criterion at all and every step below differs only in the
  # body.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-000e-4000-8000-000000000001",
         "name": "absent body under any method",
         "request": {"method": "ANY",
                     "urlPath": "/e2e/wmv-body-absent-method-independent-001/any",
                     "bodyPatterns": [{"absent": true}]},
         "response": {"status": 200, "body": "any",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  # The verbs that conventionally carry no body.
  - request: {port: mock, method: GET, path: /e2e/wmv-body-absent-method-independent-001/any}
    expect: {status: 200, body: "any"}

  - request: {port: mock, method: DELETE, path: /e2e/wmv-body-absent-method-independent-001/any}
    expect: {status: 200, body: "any"}

  # ...and the verbs that conventionally do, sent without one. These are the
  # steps a "the method decides" implementation gets wrong.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-absent-method-independent-001/any}
    expect: {status: 200, body: "any"}

  - request: {port: mock, method: PUT, path: /e2e/wmv-body-absent-method-independent-001/any}
    expect: {status: 200, body: "any"}

  # The same two verbs with a body, which is what makes the four steps above
  # assertions about the body rather than about the stub matching everything.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-absent-method-independent-001/any, body: "x"}
    expect: {status: 404}

  - request: {port: mock, method: PUT, path: /e2e/wmv-body-absent-method-independent-001/any, body: "x"}
    expect: {status: 404}
