# SPDX-License-Identifier: Apache-2.0
id: wmv-datetime-actualformat-pattern-fields-001
behaviors: [B-MATCH-BEFORE-AFTER-EQUALTODATETIME-TRUNCATEEXPECTED-ACTUALFORMAT, B-REQ-HEADERS]
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2). Status and headers are still diffed.
wm_ignore: ["$unmatched-body"]
#
# The pattern vocabulary itself, because the translation from Java's letters to
# whatever the implementation parses with is where a silent hole lives: a letter
# the translator does not know passes through as literal text, so the pattern
# still compiles, still registers, and simply never matches.
#
# Three shapes are pinned, chosen for the three ways that goes wrong:
#
#   * **Unpadded field letters** (`d/M/yyyy`). A translation table built for
#     rendering carries only the padded forms, so a single `M` survives as the
#     letter M and `14/6/2021` stops parsing while `dd/MM/yyyy` works fine —
#     which looks like a user error rather than a missing table row.
#   * **A pattern with a time** (`dd/MM/yyyy HH:mm:ss`), where the seconds have
#     to reach the comparison rather than being dropped to the day.
#   * **A partial pattern** (`yyyy`), which resolves the fields it does not name
#     to the start of the period rather than refusing the value.
steps:
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "d7000006-0000-4000-8000-000000000001",
         "name": "unpadded field letters",
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-datetime-actualformat-pattern-fields-001/unpadded",
                     "headers": {"X-When": {"equalToDateTime": "2021-06-14T00:00:00",
                                            "actualFormat": "d/M/yyyy"}}},
         "response": {"status": 200, "body": "unpadded",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - request:
      method: GET
      path: /e2e/wmv-datetime-actualformat-pattern-fields-001/unpadded
      headers: {X-When: "14/6/2021"}
    expect: {status: 200, body: "unpadded"}

  # The unpadded pattern still reads a padded value — `d` and `M` are minimum
  # widths, not exact ones.
  - request:
      method: GET
      path: /e2e/wmv-datetime-actualformat-pattern-fields-001/unpadded
      headers: {X-When: "14/06/2021"}
    expect: {status: 200, body: "unpadded"}

  # It compares, rather than accepting anything the shape fits.
  - request:
      method: GET
      path: /e2e/wmv-datetime-actualformat-pattern-fields-001/unpadded
      headers: {X-When: "15/6/2021"}
    expect: {status: 404}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "d7000006-0000-4000-8000-000000000002",
         "name": "a pattern carrying a time",
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-datetime-actualformat-pattern-fields-001/withtime",
                     "headers": {"X-When": {"equalToDateTime": "2021-06-14T12:13:14",
                                            "actualFormat": "dd/MM/yyyy HH:mm:ss"}}},
         "response": {"status": 200, "body": "withtime",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - request:
      method: GET
      path: /e2e/wmv-datetime-actualformat-pattern-fields-001/withtime
      headers: {X-When: "14/06/2021 12:13:14"}
    expect: {status: 200, body: "withtime"}

  # One second apart. An implementation that truncated the parsed value to the
  # day would answer 200 here, and the step above would not have caught it.
  - request:
      method: GET
      path: /e2e/wmv-datetime-actualformat-pattern-fields-001/withtime
      headers: {X-When: "14/06/2021 12:13:15"}
    expect: {status: 404}

  # The pattern has to be satisfied in full: a value missing the time the
  # pattern names does not parse, and an unparseable actual is a non-match.
  - request:
      method: GET
      path: /e2e/wmv-datetime-actualformat-pattern-fields-001/withtime
      headers: {X-When: "14/06/2021"}
    expect: {status: 404}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "d7000006-0000-4000-8000-000000000003",
         "name": "a partial pattern resolves the rest to the start of the period",
         "request": {"method": "GET",
                     "urlPath": "/e2e/wmv-datetime-actualformat-pattern-fields-001/yearonly",
                     "headers": {"X-When": {"equalToDateTime": "2021-01-01T00:00:00",
                                            "actualFormat": "yyyy"}}},
         "response": {"status": 200, "body": "yearonly",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - request:
      method: GET
      path: /e2e/wmv-datetime-actualformat-pattern-fields-001/yearonly
      headers: {X-When: "2021"}
    expect: {status: 200, body: "yearonly"}

  - request:
      method: GET
      path: /e2e/wmv-datetime-actualformat-pattern-fields-001/yearonly
      headers: {X-When: "2022"}
    expect: {status: 404}
