id: wmv-sel-scenario-tie-within-state-001
behaviors: [B-STUB-SCENARIONAME-REQUIREDSCENARIOSTATE-NEWSCENARIOSTATE, B-STUB-PRIORITY]
wm: verified
# Every step is served, so every body is diffed.
#
# Two stubs gated on the same state, on the same path, at the same priority. The
# gate cannot separate them and neither can the number, so the insertion
# sequence decides — scenario stubs sit in the ordering of §5.3 alongside
# everything else rather than in a list of their own consulted by state.
#
# The two lanes differ only in what happens before the request: lane B deletes
# the newer of the pair, so the same registration order produces the other
# winner. Each lane's probe path then reports which of the two transitions
# fired, which is the half a body assertion alone cannot see — the stub that
# lost must not have written anything.
steps:
  # Lane A.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0023-4000-8000-000000000001",
         "priority": 7,
         "scenarioName": "wmv-sel-scenario-tie-within-state-001-a",
         "requiredScenarioState": "Started",
         "newScenarioState": "moved by the older stub",
         "request": {"method": "POST", "urlPath": "/e2e/wmv-sel-scenario-tie-within-state-001/a/step"},
         "response": {"status": 200, "body": "older served",
                      "headers": {"Content-Type": "text/plain"}}}
    expect:
      status: 201
      body_json_subset:
        priority: 7
        requiredScenarioState: "Started"

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0023-4000-8000-000000000002",
         "priority": 7,
         "scenarioName": "wmv-sel-scenario-tie-within-state-001-a",
         "requiredScenarioState": "Started",
         "newScenarioState": "moved by the newer stub",
         "request": {"method": "POST", "urlPath": "/e2e/wmv-sel-scenario-tie-within-state-001/a/step"},
         "response": {"status": 200, "body": "newer served",
                      "headers": {"Content-Type": "text/plain"}}}
    expect:
      status: 201
      body_json_subset: {priority: 7}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0023-4000-8000-000000000003",
         "scenarioName": "wmv-sel-scenario-tie-within-state-001-a",
         "requiredScenarioState": "moved by the older stub",
         "request": {"method": "GET", "urlPath": "/e2e/wmv-sel-scenario-tie-within-state-001/a/where"},
         "response": {"status": 200, "body": "the older stub moved it",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0023-4000-8000-000000000004",
         "scenarioName": "wmv-sel-scenario-tie-within-state-001-a",
         "requiredScenarioState": "moved by the newer stub",
         "request": {"method": "GET", "urlPath": "/e2e/wmv-sel-scenario-tie-within-state-001/a/where"},
         "response": {"status": 200, "body": "the newer stub moved it",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - request: {port: mock, method: POST, path: /e2e/wmv-sel-scenario-tie-within-state-001/a/step}
    expect:
      status: 200
      headers: {Content-Type: text/plain}
      body: "newer served"

  - request: {port: mock, method: GET, path: /e2e/wmv-sel-scenario-tie-within-state-001/a/where}
    expect: {status: 200, body: "the newer stub moved it"}

  # Lane B: the same four stubs in a scenario of their own, registered in the
  # same order, and the newer of the tied pair removed before anything is asked
  # of the path. The loser of lane A wins here, so lane A's answer was about the
  # sequence and not about which of the two documents was written.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0023-4000-8000-000000000005",
         "priority": 7,
         "scenarioName": "wmv-sel-scenario-tie-within-state-001-b",
         "requiredScenarioState": "Started",
         "newScenarioState": "moved by the older stub",
         "request": {"method": "POST", "urlPath": "/e2e/wmv-sel-scenario-tie-within-state-001/b/step"},
         "response": {"status": 200, "body": "older served",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0023-4000-8000-000000000006",
         "priority": 7,
         "scenarioName": "wmv-sel-scenario-tie-within-state-001-b",
         "requiredScenarioState": "Started",
         "newScenarioState": "moved by the newer stub",
         "request": {"method": "POST", "urlPath": "/e2e/wmv-sel-scenario-tie-within-state-001/b/step"},
         "response": {"status": 200, "body": "newer served",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0023-4000-8000-000000000007",
         "scenarioName": "wmv-sel-scenario-tie-within-state-001-b",
         "requiredScenarioState": "moved by the older stub",
         "request": {"method": "GET", "urlPath": "/e2e/wmv-sel-scenario-tie-within-state-001/b/where"},
         "response": {"status": 200, "body": "the older stub moved it",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a100000a-0023-4000-8000-000000000008",
         "scenarioName": "wmv-sel-scenario-tie-within-state-001-b",
         "requiredScenarioState": "moved by the newer stub",
         "request": {"method": "GET", "urlPath": "/e2e/wmv-sel-scenario-tie-within-state-001/b/where"},
         "response": {"status": 200, "body": "the newer stub moved it",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin: {method: DELETE, path: /__admin/mappings/a100000a-0023-4000-8000-000000000006}
    expect: {status: 200}

  - request: {port: mock, method: POST, path: /e2e/wmv-sel-scenario-tie-within-state-001/b/step}
    expect: {status: 200, body: "older served"}

  - request: {port: mock, method: GET, path: /e2e/wmv-sel-scenario-tie-within-state-001/b/where}
    expect: {status: 200, body: "the older stub moved it"}

  # Lane A is still where its own winner left it, so removing a stub from lane B
  # reached neither the other scenario's state nor its stubs.
  - request: {port: mock, method: GET, path: /e2e/wmv-sel-scenario-tie-within-state-001/a/where}
    expect: {status: 200, body: "the newer stub moved it"}
