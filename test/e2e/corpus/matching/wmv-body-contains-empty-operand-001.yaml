# SPDX-License-Identifier: Apache-2.0
id: wmv-body-contains-empty-operand-001
behaviors: [B-MATCH-CONTAINS-DOESNOTCONTAIN, B-MATCH-ABSENT, B-REQ-BODYPATTERNS]
wm: verified
# The non-matching steps land on a 404 body that differs by design
# (deviation #2/#18). Status and headers are still diffed.
wm_ignore: ["$unmatched-body"]
steps:
  # An empty operand is the degenerate end of both matchers: every string
  # contains the empty string, so `contains ""` should hold for any body that
  # exists at all and `doesNotContain ""` for none. Neither matcher special-cases
  # it — the operand goes into the same substring test as any other — and the
  # only interesting row is the one where there is no body to test.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0007-4000-8000-000000000001",
         "name": "contains the empty operand",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-contains-empty-operand-001/positive",
                     "bodyPatterns": [{"contains": ""}]},
         "response": {"status": 200, "body": "positive",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "a1000006-0007-4000-8000-000000000002",
         "name": "doesNotContain the empty operand",
         "request": {"method": "POST",
                     "urlPath": "/e2e/wmv-body-contains-empty-operand-001/negative",
                     "bodyPatterns": [{"doesNotContain": ""}]},
         "response": {"status": 200, "body": "negative",
                      "headers": {"Content-Type": "text/plain"}}}
    expect: {status: 201}

  # Any body at all satisfies the positive form...
  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-empty-operand-001/positive, body: "x"}
    expect: {status: 200, body: "positive"}

  # ...and none satisfies the negative one. So over a body that exists, the two
  # behave exactly as the substring rule says, with no shortcut for the empty
  # operand on either side.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-empty-operand-001/negative, body: "x"}
    expect: {status: 404}

  # The pair inverts on an absent body, and it inverts because of the subject
  # rather than because of the operand: there is no value there, so the positive
  # form has nothing to search and the negative form has nothing that could
  # contain the operand. `doesNotContain ""` is therefore a working spelling of
  # "this request must carry no body", which is a genuinely surprising thing for
  # a corpus to have to state — and the reason to state it is that it is the one
  # request an author of `contains ""` would expect to match and it does not.
  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-empty-operand-001/positive}
    expect: {status: 404}

  - request: {port: mock, method: POST, path: /e2e/wmv-body-contains-empty-operand-001/negative}
    expect: {status: 200, body: "negative"}
