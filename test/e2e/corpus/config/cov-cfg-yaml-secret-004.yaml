# SPDX-License-Identifier: Apache-2.0
id: cov-cfg-yaml-secret-004
behaviors: [B-CFG-COUCHBASE-USERNAME-COUCHBASE-PASSWORD, B-CFG-STORE]
# The file this variant boots from carries a Couchbase username and password and
# no connection string, which is the shape that makes both claims below
# assertable at once.
config: yaml-config
# n/a: a store driver and a configuration dump are both mockulus-specific, and
# neither is observed through a response WireMock could be asked for.
wm: n/a
steps:
  # The startup summary, and the first claim. `store` is left at its default of
  # `auto`, which resolves to couchbase only when a connection string is set —
  # credentials alone must not select the driver. The nested section in the file
  # sets two couchbase keys, so a resolver that asked "is anything under
  # couchbase configured?" instead of "is there a connstr?" would report
  # `couchbase` here and then fail to reach a cluster that does not exist.
  - logprobe:
      json_fields:
        msg: mockulus started
        store: memory

  # The second claim, and the reason the password is in the file at all: the
  # configuration dump is written to the log, teams put real credentials in
  # their deployments, and §14.2 keeps secrets out of it. The dump prints one
  # line per key, so asserting this line in full is the same as asserting the
  # value is not on it: the marker stands in place of the password, not beside
  # it.
  #
  # This line proves two things at once, which is why it is worth its own case.
  # An unset password renders as an empty value rather than as the marker, so
  # the marker being here means a value did arrive from the file; and the value
  # that arrived is not the one printed.
  #
  # The value in the file carries an apostrophe, which is the one thing about a
  # password a configuration parser can get wrong without anyone noticing until
  # the store refuses the credentials. Redaction is what makes that unassertable
  # from here — deliberately — so what stands in for it is that this instance
  # exists: a mishandled quote is a parse error and a pod that never started.
  - logprobe:
      json_fields:
        msg: config
        setting: "couchbase.password=[redacted]"

  # Redaction has to be selective, or it stops being a feature and becomes a
  # dump nobody can use. The username sits in the same section and arrived
  # through the same parse, and it is not a secret — an operator reading this
  # line has to be able to see which account the pod authenticates as. A blanket
  # redactor would print the marker here too, and this step is what says so.
  - logprobe:
      json_fields:
        msg: config
        setting: couchbase.username=e2e-yaml-user

  # Reported is not the same as used. The driver the startup line named is the
  # one behind this round trip: a stub registered through the admin API and
  # served from the snapshot it produced.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id": "c0000001-0000-4000-8000-000000000004",
         "request": {"method": "GET", "urlPath": "/e2e/cov-cfg-yaml-secret-004/stored"},
         "response": {"status": 200, "body": "served from the resolved driver"}}
    expect: {status: 201}

  - request: {port: mock, method: GET, path: /e2e/cov-cfg-yaml-secret-004/stored}
    expect: {status: 200, body: "served from the resolved driver"}

  - admin: {method: DELETE, path: /__admin/mappings/c0000001-0000-4000-8000-000000000004}
    expect: {status: 200}
