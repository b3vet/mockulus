# SPDX-License-Identifier: Apache-2.0
id: store-couchbase-credentials-001
behaviors: [B-CFG-COUCHBASE-USERNAME-COUCHBASE-PASSWORD]
requires: [couchbase]
config: cb-verbose
# n/a: WireMock authenticates to nothing. The contract is SPEC §7.2 and §17.
wm: n/a
steps:
  # Authentication is never reported as a result, because it is the reason there
  # is a session at all: Couchbase refuses to open a bucket for a user it does
  # not accept, so the driver reaching "connected" *is* the credentials having
  # been accepted. Wrong ones produce the retry loop of §4.4 instead, and no
  # instance that logged this line is in it.
  - logprobe:
      json_fields:
        msg: connected to couchbase

  # The password is the one value that must never reach the output. The resolved
  # configuration is echoed at debug level (§14.2) and is the one surface where
  # it could plausibly appear, so this is where the marker has to be visible
  # instead. The username on the next line is the control: it is not a secret,
  # it is dumped verbatim, and without it a redaction assertion would pass just
  # as happily against a dump that had silently stopped printing anything.
  - logprobe: {contains: "couchbase.password=[redacted]"}

  - logprobe: {contains: "couchbase.username=Administrator"}

  # And the authenticated session is a working one rather than merely an open
  # one: a KV write needs the same credentials the connection was made with, and
  # a bucket opened by an under-privileged user fails here rather than earlier.
  - admin:
      method: POST
      path: /__admin/mappings
      body: |
        {"id":"2d000001-0000-4000-8000-000000000001",
         "request":{"method":"GET","urlPath":"/e2e/store-couchbase-credentials-001/ledger"},
         "response":{"status":200,"body":"written as the configured user"}}
    expect: {status: 201}

  - request: {port: mock, method: GET, path: /e2e/store-couchbase-credentials-001/ledger}
    expect: {status: 200, body: "written as the configured user"}

  # Cleanup by identity: the deployment is shared with the other cases on this
  # variant.
  - admin: {method: DELETE, path: /__admin/mappings/2d000001-0000-4000-8000-000000000001}
    expect: {status: 200}
