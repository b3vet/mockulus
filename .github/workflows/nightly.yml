# SPDX-License-Identifier: Apache-2.0
#
# The nightly pipeline of SPEC §19.5. Perf and fuzz failures block a release
# but not a merge: they are statistical and environment-sensitive, so a
# regression here opens an issue rather than flaking every PR.

name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  perf:
    name: full perf suite (S1–S10)
    # Self-hosted perf runners never execute fork code (SPEC §22.4); the
    # schedule and dispatch triggers cannot come from a fork.
    runs-on: ${{ vars.PERF_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: grafana/setup-k6-action@v1

      - name: build
        run: go build -trimpath -ldflags "-s -w -X main.version=nightly" -o bin/mockulus ./cmd/mockulus

      - name: S1 — baseline throughput and latency
        run: |
          MOCKULUS_LOG_LEVEL=warn ./bin/mockulus &
          for i in $(seq 1 30); do curl -sf localhost:9090/readyz >/dev/null && break; sleep 1; done
          k6 run -e MODE=latency -e RATE=20000 -e DURATION=60s test/load/s1.js
          k6 run -e MODE=throughput test/load/s1.js
          pkill -f 'bin/mockulus' || true

      # S11 reports what tracing costs; it does not gate on it. The SLOs of
      # §16.1 are stated for the default configuration, and a deployment that
      # turns tracing on is choosing a different trade — one worth publishing a
      # measured number for rather than an assurance. `continue-on-error` says
      # the same thing the scenario's missing thresholds do.
      - name: S11 — the same shape with tracing on (informational)
        continue-on-error: true
        run: |
          # A collector that accepts everything and keeps nothing, so the number
          # is mockulus' own cost and not a measurement of a trace backend.
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Sink(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length') or 0))
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/x-protobuf')
                  self.send_header('Content-Length', '0')
                  self.end_headers()
              def log_message(self, *args): pass
          HTTPServer(('127.0.0.1', 4318), Sink).serve_forever()
          PY
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:4318 && break || sleep 1; done
          MOCKULUS_LOG_LEVEL=warn \
          MOCKULUS_TRACING_ENABLED=true \
          MOCKULUS_TRACING_ENDPOINT=127.0.0.1:4318 \
          MOCKULUS_TRACING_INSECURE=true \
          MOCKULUS_TRACING_SAMPLE_RATIO=1 \
            ./bin/mockulus &
          for i in $(seq 1 30); do curl -sf localhost:9090/readyz >/dev/null && break; sleep 1; done
          k6 run -e MODE=latency -e RATE=20000 -e DURATION=60s test/load/s11.js
          k6 run -e MODE=throughput test/load/s11.js
          echo "trace export failures: $(curl -s localhost:9090/metrics | awk '/^mockulus_trace_export_failures_total/ {print $2}')"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: test/load/.results/
          if-no-files-found: ignore

  soak:
    name: S8 — one-hour soak and leak gate
    runs-on: ${{ vars.PERF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: grafana/setup-k6-action@v1
      - name: soak
        run: |
          go build -o bin/mockulus ./cmd/mockulus
          MOCKULUS_LOG_LEVEL=warn ./bin/mockulus &
          for i in $(seq 1 30); do curl -sf localhost:9090/readyz >/dev/null && break; sleep 1; done
          k6 run --no-thresholds -e MODE=latency -e RATE=10000 -e DURATION=60m test/load/s1.js &
          k6pid=$!
          # RSS must not grow across the run: this is the leak gate.
          start=$(curl -s localhost:9090/metrics | awk '/^process_resident_memory_bytes/ {print $2}')
          wait $k6pid
          end=$(curl -s localhost:9090/metrics | awk '/^process_resident_memory_bytes/ {print $2}')
          echo "RSS start=$start end=$end"
          awk -v s="$start" -v e="$end" 'BEGIN { if (e > s * 1.25) { print "RSS grew more than 25% over the soak"; exit 1 } }'

  fuzz:
    name: fuzzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: fuzz the parsers
        run: |
          for pkg in ./internal/stub ./internal/config ./internal/match; do
            for target in $(go test "$pkg" -list 'Fuzz.*' 2>/dev/null | grep '^Fuzz' || true); do
              echo "== $pkg $target"
              go test "$pkg" -run "^$target$" -fuzz "^$target$" -fuzztime=5m
            done
          done

  differential:
    name: T5 — differential against pinned WireMock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Built inline for the same reason the merge lane builds it: not because
      # the corpus needs a bundle — the UI cases pass against the placeholder
      # too — but so the binary under test is shaped like the one that ships,
      # with the real assets embedded. The UI cases are `wm: n/a` and take no
      # part in the diffing this lane exists for; what the build buys here is a
      # nightly run of the checks that only apply to a real bundle.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make ui-build

      # Nightly rather than only on merge because the oracle is a pinned image
      # and this lane is where a bump to WIREMOCK_VERSION gets found out — on a
      # schedule nobody is waiting on, instead of in the PR that bumped it.
      - name: build
        run: go build -trimpath -o bin/mockulus ./cmd/mockulus
      - name: replay every wm:verified case against the oracle
        run: go run ./test/e2e/runner --binary bin/mockulus --parallel 16 --differential

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: differential-artifacts
          path: test/e2e/.artifacts/
          if-no-files-found: ignore

  # The browser smoke of SOW decision U9, and the accessibility pass that rides
  # with it.
  #
  # `continue-on-error` is the decision, not an oversight. This lane's other
  # jobs are here because they are statistical or environment-sensitive; this
  # one is here because it owns a browser, and a browser is the likeliest thing
  # in this repository to cost the PR gate its zero-flake record. What the smoke
  # covers is also already gated where it can be: the serving contract — the
  # prefix, the SPA fallback, assets-200-while-API-401s — is corpus behaviour
  # that runs on every PR with no browser involved. What is left for a browser
  # is the class neither vitest nor the Go corpus can reach, and finding that
  # the morning after is worth having without making it a gate. U9 promotes
  # this to blocking on evidence that it has earned it; the evidence is a run of
  # nightlies in which it fails only when something is wrong.
  #
  # It runs against the embedded bundle in a real binary rather than the vite
  # dev server, which is the whole point: the router's base path, the CSP the Go
  # handler sends and the token header reaching the admin mux are all properties
  # of the shipped arrangement and none of them exists under `vite dev`.
  ui-smoke:
    name: admin UI browser smoke (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      # Both configurations are real deployments and they take different paths
      # through the UI: without a token nothing ever 401s and the sheet must
      # never appear, and with one the first call 401s and everything after it
      # depends on a header. `fail-fast: false` so that one of them failing
      # still reports what the other did.
      fail-fast: false
      matrix:
        include:
          - name: open
            token: ""
          - name: token-protected
            token: nightly-ui-smoke-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: build the bundle and the binary that embeds it
        run: |
          make ui-build
          make build

      # Chromium alone, for the reason playwright.config.ts records: the three
      # questions the suite asks have no answer that differs by engine.
      - name: install the browser
        run: pnpm --filter mockulus-ui exec playwright install --with-deps chromium

      - name: smoke (${{ matrix.name }})
        env:
          MOCKULUS_UI_E2E_TOKEN: ${{ matrix.token }}
        run: pnpm --filter mockulus-ui run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke-${{ matrix.name }}
          path: ui/test-results/
          if-no-files-found: ignore

  vuln:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
