# SPDX-License-Identifier: Apache-2.0
#
# The PR pipeline of SPEC §19.5. Every stage here is required to merge, and the
# E2E gate is the one that matters: no artifact ships without it.
#
# This pipeline needs no secrets, by design, so it runs for fork PRs on hosted
# runners (SPEC §22.4).

name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: SPDX headers
        run: make spdx

      - name: gofmt
        # No exclusions: internal/handlebars was written here rather than
        # vendored (SPEC §10.1, §22.1), so it is held to the same bar as the
        # rest of the tree.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      # v8 is the first release line that installs golangci-lint v2, which is
      # what .golangci.yml is written for and what can target Go 1.25.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: spec and code agree
        # The §13 table is generated from the config struct; drift fails here
        # rather than being discovered by a reader.
        run: go test ./internal/config -run TestSpecConfigTable

      - name: the compatibility matrix is derived, not asserted
        # docs/compatibility.md is generated from the behavior catalog and the
        # corpus — the same two files the E2E gate is derived from — so that the
        # document cannot claim support the gate does not enforce. That property
        # only holds if the check runs: the §13 table above and
        # THIRD_PARTY_LICENSES in the license job were both gated and this was
        # not, which left the most public of the three claims the only one that
        # could drift.
        run: make compat-docs-check

  unit:
    name: unit + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -count=1 ./...

      # The allocation ceilings are built out of the race suite above, since the
      # detector's own allocations are neither ours nor repeatable. This is the
      # run that asserts them.
      - name: hot-path allocation budgets
        run: make test-alloc

  ui:
    name: admin UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm has to resolve before setup-node runs: `cache: pnpm` works by
      # asking pnpm where its store directory is, and cannot ask a pnpm that is
      # not there yet. The action reads the version from package.json's
      # packageManager field, so the pin still lives in the repository, and
      # Node's version comes from .nvmrc — the same file the Docker stage
      # pins itself to.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Frozen by default on CI, and named anyway: an install that resolved
      # something the lockfile does not describe is a finding, not a fixup.
      - run: pnpm install --frozen-lockfile

      # svelte-check, eslint and prettier.
      - run: pnpm run check

      # vitest. Component behaviour lives here; the serving contract — prefix,
      # SPA fallback, headers, the token exemption — is gated by the Go corpus
      # in the e2e job below, against a binary built from this job's output.
      - run: pnpm run test

      - run: pnpm run build

      # Handed to the e2e job so the gate runs against a binary with the real
      # UI embedded rather than the placeholder. Building it once and passing it
      # along keeps the second pnpm install out of the critical path of a lane
      # that has fifteen minutes to spend (SPEC §19.5).
      - uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: internal/adminui/dist/
          if-no-files-found: error
          retention-days: 1

  sdk:
    name: admin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The contract lint is Go, the rest of the job is Node, and both halves
      # belong here: api/openapi.yaml is what the SDK's types come from, so the
      # check that it still describes the server's surface is the SDK's own
      # gate rather than a general one.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Cross-checked against the behavior catalog in both directions: a route
      # the server implements and the contract omits is a call the SDK cannot
      # make, and a route the contract invents is one that compiles and 404s.
      - run: make contract-lint

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The committed types are regenerated and diffed. This is the other half
      # of the coupling rule: the contract lint above proves the contract still
      # describes the server, and this proves the types still describe the
      # contract. A surface change that reaches neither fails here rather than
      # reaching a consumer as a type that quietly disagrees with the wire.
      - run: pnpm run sdk:gen:check

      # tsc, eslint and prettier over the package.
      - run: pnpm run sdk:check

      # The unit lane: URL and query construction, error mapping, the Appendix B
      # code table held against the specification in both directions.
      - run: pnpm run sdk:test

      # The published artifact has to compile, and a package that type-checks
      # can still fail to emit — a declaration that cannot be written is only
      # found by writing it.
      - run: pnpm run sdk:build

      # The integration lane drives a real mockulus the suite starts itself, so
      # it needs a binary. This is the regression gate for the SDK's actual
      # claims: a client that type-checks against the contract can still send a
      # request the server refuses, and only a live round trip finds that.
      - run: go build -trimpath -o bin/mockulus ./cmd/mockulus
      - run: pnpm run sdk:test:integration

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo; echo "Sign your commits with: git commit -s"; exit 1
          fi

  license:
    name: license gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # For the npm half of the gate below. go-licenses resolves the Go module
      # graph and nothing else, so the packages the admin UI is built from — and
      # the ones whose code ends up inlined in the bundle the binary embeds —
      # need a checker of their own.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: every dependency is on the allowlist
        # Copyleft is denied for the shipped binary's module graph with no
        # exceptions (SPEC §22.1).
        run: make license-check
      - name: THIRD_PARTY_LICENSES matches the module graph
        # Regenerating and diffing is what makes the attribution file a record
        # rather than a promise: a new dependency fails here until its entry is
        # committed alongside it.
        run: |
          make license-report
          git diff --exit-code THIRD_PARTY_LICENSES

      - name: every npm package is permissively licensed
        run: |
          pnpm install --frozen-lockfile
          make npm-license-check

  e2e:
    name: e2e gate (T1)
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The bundle the ui job built, unpacked over the committed placeholder so
      # that //go:embed all:dist takes in the real site. This job runs no Node
      # of its own: the UI is built once per pipeline and the gate consumes it,
      # which is also what makes the corpus' serving cases assert something —
      # against a placeholder build they would be asserting the notice page.
      - uses: actions/download-artifact@v4
        with:
          name: admin-ui-dist
          path: internal/adminui/dist/

      # Coverage is collected from the instrumented build; the shippable image
      # is smoke-booted separately so nothing ships ungated.
      - name: build instrumented mockulus
        run: go build -cover -covermode=atomic -o bin/mockulus-cover ./cmd/mockulus

      - name: run the gate
        env:
          GOCOVERDIR: ${{ github.workspace }}/.coverdata
        run: |
          mkdir -p "$GOCOVERDIR"
          go run ./test/e2e/runner \
            --binary bin/mockulus-cover \
            --corpus test/e2e/corpus \
            --catalog test/e2e/catalog \
            --parallel 16

      - name: coverage floor
        env:
          GOCOVERDIR: ${{ github.workspace }}/.coverdata
        run: ./scripts/coverage-floor.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: test/e2e/.artifacts/
          if-no-files-found: warn

  image:
    name: image + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No artifact from the ui job here, deliberately. The Dockerfile builds
      # the admin UI in its own node:22-alpine stage, so the image already
      # carries it — and injecting a prebuilt bundle instead would mean the PR
      # lane never exercised the path a release actually takes. The UI is built
      # twice per pipeline as a result, which is the price of the Dockerfile
      # being buildable from a clean checkout.
      - name: build the shippable image
        run: docker build --build-arg VERSION=pr-${{ github.sha }} -t mockulus:pr .

      - name: boot, serve, admin
        # The ~20-case shippable-image smoke of SPEC §19.5: prove the artifact
        # that would actually ship starts and serves.
        run: |
          docker run -d --name mockulus-smoke -p 18080:8080 -p 19090:9090 mockulus:pr
          for i in $(seq 1 60); do
            if curl -sf localhost:19090/readyz >/dev/null; then break; fi
            sleep 1
          done
          set -e
          curl -sf localhost:19090/healthz >/dev/null
          curl -sf localhost:19090/readyz  >/dev/null
          curl -sf localhost:18080/__admin/health | grep -q '"status":"healthy"'
          curl -sf -X POST localhost:18080/__admin/mappings \
            -H 'Content-Type: application/json' \
            -d '{"request":{"method":"GET","urlPath":"/smoke"},"response":{"status":200,"body":"ok"}}' >/dev/null
          test "$(curl -s localhost:18080/smoke)" = "ok"
          curl -s localhost:19090/metrics | grep -q '^mockulus_build_info'

          # The image's Node stage did its job. The UI route answers either way
          # — a placeholder build serves an explanatory notice rather than a
          # 404 — so the status code proves nothing here and the body has to be
          # the thing that is checked.
          ui=$(curl -sf localhost:18080/__admin/mockulus/ui/)
          case "$ui" in
            *"built without the admin UI"*)
              echo "the image is serving the no-UI notice: the ui stage produced nothing"
              exit 1
              ;;
          esac

          docker rm -f mockulus-smoke
