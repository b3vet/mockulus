# SPDX-License-Identifier: Apache-2.0
#
# The release pipeline of SPEC §19.5 and §22.5. Everything the merge pipeline
# runs, plus multi-arch images, SBOM, signing and provenance. Any red gate
# blocks the tag.
#
# Release credentials live in a protected environment, OIDC-federated and
# tag-triggered only; self-hosted runners never touch this workflow.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/b3vet/mockulus

jobs:
  gate:
    name: full gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: make spdx
      - run: go test -race -count=1 ./...

      - name: E2E gate on the shippable binary
        run: |
          go build -trimpath -o bin/mockulus ./cmd/mockulus
          go run ./test/e2e/runner --binary bin/mockulus --parallel 16

      - name: license gate
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./cmd/... ./internal/... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

  publish:
    name: publish
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write      # OIDC, for keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push multi-arch images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - uses: sigstore/cosign-installer@v3
      - name: sign the image
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          output-file: mockulus-sbom.spdx.json

      - name: attach the SBOM to the image
        run: |
          cosign attest --yes --predicate mockulus-sbom.spdx.json \
            --type spdxjson ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: package and push the Helm chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/chart --version "$version" --app-version "$version"
          helm push "mockulus-$version.tgz" \
            "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
