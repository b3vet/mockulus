# SPDX-License-Identifier: Apache-2.0
#
# The release pipeline of SPEC §19.5 and §22.5. Everything the merge pipeline
# runs, plus multi-arch images, SBOM, signing and provenance. Any red gate
# blocks the tag.
#
# Release credentials live in a protected environment, OIDC-federated and
# tag-triggered only; self-hosted runners never touch this workflow.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/b3vet/mockulus

jobs:
  gate:
    name: full gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # pnpm has to resolve before setup-node runs: `cache: pnpm` works by
      # asking pnpm where its store directory is, and cannot ask a pnpm that is
      # not there yet. The action reads the version from package.json's
      # packageManager field, so the pin still lives in the repository.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: make spdx
      - run: go test -race -count=1 ./...

      - name: build the admin UI
        # The gate compiles the binary it then tests, so it needs the same
        # inputs the released binary has. Without this the corpus would be run
        # against a build serving the "built without UI" notice, and the tag
        # would be gated on an artifact nobody is going to ship.
        run: make ui-build

      - name: E2E gate on the shippable binary
        # With T5: a tag ships the compat claim, so the differential runs here
        # too rather than being inherited from whatever the merge pipeline saw.
        run: |
          go build -trimpath -o bin/mockulus ./cmd/mockulus
          go run ./test/e2e/runner --binary bin/mockulus --parallel 16 --differential

      - name: license gate
        run: |
          go install github.com/google/go-licenses@latest
          make license-check
          make license-report
          git diff --exit-code THIRD_PARTY_LICENSES

      - name: npm license gate
        # go-licenses cannot see the pnpm workspace, so the packages the admin
        # UI is built from are checked separately against their own allowlist.
        run: make npm-license-check

  publish:
    name: publish
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write      # OIDC, for keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # For goreleaser, whose `before` hooks run `make ui-build` so the released
      # binaries embed the admin UI. The image does not need this — the
      # Dockerfile builds the UI in its own stage — but the goreleaser step at
      # the end of this job runs on the runner itself.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push multi-arch images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - uses: sigstore/cosign-installer@v3
      - name: sign the image
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          output-file: mockulus-sbom.spdx.json

      - name: attach the SBOM to the image
        run: |
          cosign attest --yes --predicate mockulus-sbom.spdx.json \
            --type spdxjson ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: package and push the Helm chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/chart --version "$version" --app-version "$version"
          helm push "mockulus-$version.tgz" \
            "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
