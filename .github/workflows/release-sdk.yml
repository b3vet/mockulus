# SPDX-License-Identifier: Apache-2.0

# Publishes @mockulus/admin-sdk to npm.
#
# Separate from release.yml, and triggered by its own tag prefix, because the
# SDK versions independently of the server (SOW decision K6): it will iterate
# faster than the server does at first, and a client fix should not need a
# server release to reach anyone. `v1.2.0` releases the server; `ts-sdk/v0.1.1`
# releases the client; neither waits for the other.
name: release sdk

on:
  push:
    tags:
      - 'ts-sdk/v*'

permissions:
  contents: read

jobs:
  # The same shape as release.yml: gate first, publish second, and the publish
  # job is the only one holding credentials. A tag is not a reason to skip the
  # checks — it is the last moment they are cheap.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # The contract lint is a Go program and it gates the SDK's own source of
      # truth: if api/openapi.yaml no longer describes the server, the types
      # generated from it describe nothing anybody can rely on.
      - run: make contract-lint

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The committed types are regenerated and diffed. A published package
      # whose types disagree with the contract is worse than an unpublished one.
      - run: pnpm run sdk:gen:check

      - run: pnpm run sdk:check
      - run: pnpm run sdk:test

      # The integration lane needs a server, and it is the only check that
      # proves the client can still talk to one. A package that type-checks
      # against the contract can still send something the server refuses.
      - run: go build -trimpath -o bin/mockulus ./cmd/mockulus
      - run: pnpm run sdk:test:integration

      # Every npm package in the workspace, against the allowlist. The Go gate
      # cannot see them.
      - run: ./scripts/check-npm-licenses.sh

      # The tag and the manifest have to agree. Publishing 0.1.0 from a tag that
      # says 0.1.1 produces a registry entry nobody can trace back to a commit,
      # and npm will not let you replace it.
      - name: the tag matches the version in package.json
        run: |
          tag_version="${GITHUB_REF_NAME#ts-sdk/v}"
          pkg_version="$(node -p "require('./sdk/typescript/package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag ts-sdk/v${tag_version} does not match sdk/typescript/package.json ${pkg_version}" >&2
            echo "Bump the manifest and re-tag; a published version cannot be replaced." >&2
            exit 1
          fi
          echo "publishing @mockulus/admin-sdk ${pkg_version}"

  publish:
    name: publish
    needs: gate
    runs-on: ubuntu-latest
    # The protected environment is where the approval and the credential live,
    # matching the server's release job. Nothing before this point can publish.
    environment: release
    permissions:
      contents: read
      # OIDC, which is what `--provenance` signs with. It ties the published
      # tarball to this workflow, this repository and this commit, so a consumer
      # can verify where it came from rather than trusting the registry entry.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Built here rather than carried from the gate job: the tarball that goes
      # to the registry should be produced by the job that publishes it, in one
      # step, so there is no window where an artifact could be substituted.
      - run: pnpm run sdk:build

      - name: publish to npm with provenance
        working-directory: sdk/typescript
        # `publishConfig` in package.json already sets access:public and
        # provenance:true, so the flags are not repeated here — one spelling of
        # the intent, in the file a reader would look in.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
