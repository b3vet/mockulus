# Workspace members.
#
# `ui/` is the embedded admin UI — Vite builds it into internal/adminui/dist,
# where go:embed picks it up.
#
# `sdk/typescript` (@mockulus/admin-sdk) is the published client. The UI takes
# it as a workspace dependency for its data layer, which is the reason the two
# live in one workspace rather than two npm projects: the server, the contract
# and the client move in one commit, and CI tests the client against the server
# it was built beside.
packages:
  - ui
  - sdk/typescript

